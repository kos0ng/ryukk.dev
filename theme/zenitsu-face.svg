<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <title>Zenitsu in three-quarter profile against a golden moon</title>
  <defs>
    <linearGradient id="moon" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ffbb22"/><stop offset=".52" stop-color="#ffed38"/><stop offset="1" stop-color="#ffcf79"/>
    </linearGradient>
  </defs>
  <!-- A stepped lunar disc; the night sky outside it is the header itself. -->
  <path fill="url(#moon)" d="M19 1h10v1h4v1h3v2h3v2h2v2h2v3h2v3h1v4h1v10h-1v4h-2v3h-2v3h-2v2h-3v2h-3v2h-5v1H19v-1h-5v-2h-3v-2H8v-2H6v-3H4v-3H2v-4H1V19h1v-4h1v-3h2V9h2V7h2V5h3V3h3V2h4z"/>
  <!-- Burnt-orange lower locks, visible behind the cheek and neck. -->
  <path fill="#573633" d="M12 14h22v2h3v6h2v4h2v2h-3v3h-3v2h1v1h-5v2h-5v2h-5V27H11v-4H7v-2h2v-3H8v-2h4z"/>
  <path fill="#ef8b56" d="M13 15h20v2h3v6h2v3h2v1h-4v4h-3v2h-4v2h-4v2h-3V25H12v-3H9l2-4-1-2z"/>
  <path fill="#bf6650" d="M31 25h1v5h-1zm4-1h1v4h-1zm-9 6h1v3h1v2h-2z"/>
  <!-- Lifted chin and high collar turn away from the gold shoulder. -->
  <path fill="#593934" d="M11 17h18v6h-1v6h-2v6h1v3l-9 3v-5h-5v-1h-2v-4h-1v-3H8v-2l2-2v-5h1z"/>
  <path fill="#f2b9a7" d="M12 18h16v5h-1v5h-2v8l-6 3v-4h-5v-1h-2v-4h-1v-3H9v-1l2-2v-5h1z"/>
  <path fill="#ffead0" d="M12 18h14v5h-2v4h2v2h-3v2h-3v2h-3v1h-4v-1h-1v-4h-1v-2H9v-1l2-2v-5h1z"/>
  <!-- Far eye is foreshortened; the near iris looks to the left. -->
  <path fill="#fff7e9" d="M10 21h4v3h-4zm6 1h6v3h-5v-1h-1z"/>
  <path fill="#4b3340" d="M10 21v-1h3v1h1v1h-1v1h-2v-2zm6 1v-1h4v1h2v1h-2v1h-2v-2z"/>
  <path fill="#b37252" d="M11 23h2v1h-2zm7 1h2v1h-2z"/>
  <path fill="#af7568" d="M11 29h2v1h-2z"/>
  <!-- Layered fringe: light at the crown, apricot in the folds, copper tips. -->
  <path fill="#634039" d="M8 18v-3h3v-3h2V9h3V7h4V6h8v1h4v2h3v3h2v4h1v5h1v4h2v2h-5v1h-4v-2h-2v3h-3v2h-4v-2h-2l3-7v-3h-2v2h-3v-3h-2v1h-2v2l-3 1v-5l-3 4H8l2-5z"/>
  <path fill="#ffac71" d="M9 17v-1h3v-4h2V9h3V8h4V7h6v1h5v2h2v3h2v4h1v5h1v3h2v1h-5v1h-2v-3h-3v3h-3v3h-3v-1h-2l3-6v-7h-3v4h-2v-5h-3v3h-3v2l-1 1v-7l-4 6 2-5z"/>
  <path fill="#ffe28a" d="M11 15h1v-3h2V9h3V8h4V7h6v1h4v2h3v3h1v4h1v4h-2l-2-3v4h-2l-3-4-1 6h-2l2-8v-4l-3 4v2h-2v-5l-2 2v2h-2l1-6-3 4-2 2v-4z"/>
  <path fill="#fff0b3" d="M15 11V9h3V8h4v1h-3v1h-2v1zm10-3h3v1h2v1h-3V9h-2z"/>
  <path fill="#e78552" d="M27 24h1l-2 5h-2zm5-6h1l2 5v2h-1zm-18-2h1v3h-1z"/>
  <!-- White collar piping and the golden, triangle-patterned haori. -->
  <path fill="#302839" d="M17 38l8-3h3v4h4v1h3v2h2v6H9l4-5h3v-4h1z"/>
  <path fill="#56445f" d="M17 40l10-4v4l-7 5-2 3h-3z"/>
  <path fill="#fff0dd" d="M17 38l8-3h2v1l-9 4v3h-1z"/>
  <path fill="#ed964f" d="M10 48l5-6v3l-2 3zm10 0 7-7 3-2h3v1h2v2h2v6z"/>
  <path fill="#ffcf65" d="M23 48l6-6h2v-1h3v1h2v6z"/>
  <path fill="#fff2ba" d="M29 47l2-3 2 3z"/>
</svg>
