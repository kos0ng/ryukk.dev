name: Publish blog to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test
      - run: npm run build
      - name: Prepare and check published links
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/prepare-pages.py "$SITE_URL"
          python3 scripts/check-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
